    <meta name="robots" content="noindex, follow" />
    
    <!-- Open Graph tags pointing to the canonical domain -->
    <meta property="og:url" content="https://nihaltp.vercel.app/" />
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

        }

            text-align: center;
            padding: 2rem;
        }

            margin-bottom: 1rem;
        }

            color: #fff;

        }
    </style>
</head>

    <div class="container">

    <!-- JavaScript redirect as fallback -->

</body>
</html>
